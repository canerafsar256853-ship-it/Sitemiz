<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onaylı Üyelik Test Sistemi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #121316; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1c1e24; padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #2d3139; }
        h2 { margin-bottom: 1rem; color: #c084fc; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f0814; border: 1px solid #374151; border-radius: 6px; color: #fff; }
        button { width: 100%; padding: 10px; margin-top: 10px; background: #8b5cf6; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #7c3aed; }
        .switch-link { margin-top: 15px; font-size: 0.85rem; color: #9ca3af; cursor: pointer; }
        .switch-link span { color: #c084fc; text-decoration: underline; }
        .msg { margin-top: 10px; font-size: 0.85rem; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        .pending { color: #f59e0b; }
        #app-content { display: none; }
    </style>
</head>
<body>

    <!-- GİRİŞ VE KAYIT KARTI -->
    <div class="card" id="auth-card">
        <!-- Kayıt Formu -->
        <div id="register-box">
            <h2>Kayıt Ol (Talep Oluştur)</h2>
            <input type="text" id="reg-name" placeholder="Adınız">
            <input type="email" id="reg-email" placeholder="E-Posta">
            <input type="password" id="reg-pass" placeholder="Şifre">
            <button onclick="requestAccount()">Kayıt Talebi Gönder</button>
            <div class="switch-link" onclick="toggleAuth('login')">Zaten hesabın var mı? <span>Giriş Yap</span></div>
        </div>

        <!-- Giriş Formu -->
        <div id="login-box" style="display: none;">
            <h2>Giriş Yap</h2>
            <input type="email" id="login-email" placeholder="E-Posta">
            <input type="password" id="login-pass" placeholder="Şifre">
            <button onclick="login()">Giriş Yap</button>
            <div class="switch-link" onclick="toggleAuth('register')">Hesabın yok mu? <span>Kayıt Talebi Oluştur</span></div>
        </div>

        <div id="msg" class="msg"></div>
    </div>

    <!-- GİZLİ SİTE İÇERİĞİ (SADECE ONAYLANANLAR GÖRÜR) -->
    <div class="card" id="app-content">
        <h2>🎉 HOŞ GELDİNİZ!</h2>
        <p>Hesabınız yönetici tarafından onaylandığı için bu içeriğe erişebildiniz.</p>
        <button onclick="logout()" style="background: #ef4444;">Çıkış Yap</button>
    </div>

    <script>
        // FORM DEĞİŞTİRME MANTIĞI
        function toggleAuth(type) {
            document.getElementById('msg').innerText = '';
            if(type === 'login') {
                document.getElementById('register-box').style.display = 'none';
                document.getElementById('login-box').style.display = 'block';
            } else {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('register-box').style.display = 'block';
            }
        }

        // 1. KAYIT TALEBİ OLUŞTURMA (LOCALSTORAGE TESTİ)
        function requestAccount() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const pass = document.getElementById('reg-pass').value;
            const msg = document.getElementById('msg');

            if(!name || !email || !pass) {
                msg.className = "msg error";
                msg.innerText = "Lütfen tüm alanları doldurun!";
                return;
            }

            let users = JSON.parse(localStorage.getItem('test_users') || '{}');

            if(users[email]) {
                msg.className = "msg error";
                msg.innerText = "Bu e-posta ile zaten talep oluşturulmuş!";
                return;
            }

            // Yeni Kullanıcı Oluştur (Varsayılan durum: 'beklemede')
            users[email] = {
                name: name,
                pass: pass,
                status: 'beklemede' // 'beklemede', 'onaylandi', 'reddedildi'
            };

            localStorage.setItem('test_users', JSON.stringify(users));
            msg.className = "msg pending";
            msg.innerText = "Kayıt talebiniz alındı! Yönetici onayı bekleniyor.";
        }

        // 2. GİRİŞ KONTROLÜ
        function login() {
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('msg');

            let users = JSON.parse(localStorage.getItem('test_users') || '{}');
            const user = users[email];

            if(!user || user.pass !== pass) {
                msg.className = "msg error";
                msg.innerText = "E-posta veya şifre hatalı!";
                return;
            }

            // ONAY KONTROLÜ
            if(user.status === 'beklemede') {
                msg.className = "msg pending";
                msg.innerText = "Hesabınız henüz yönetici tarafından ONAYLANMADI!";
            } else if(user.status === 'reddedildi') {
                msg.className = "msg error";
                msg.innerText = "Hesap talebiniz yönetici tarafından REDDEDİLDİ!";
            } else if(user.status === 'onaylandi') {
                document.getElementById('auth-card').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
            }
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
